services:
  app:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: starcoach:latest
    ports:
      - "${STARCOACH_PUBLIC_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      STARCOACH_HOST: 0.0.0.0
      STARCOACH_DB: /data/starcoach.db
      STARCOACH_DATA_DIR: /data/torob-dataset
      STARCOACH_LOG_DIR: /data/logs
    restart: unless-stopped
