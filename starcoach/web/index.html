<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>دستیار خرید حضوری</title>
  <link rel="stylesheet" href="/static/app.css?v={{asset_version}}">
</head>
<body>
  <header class="topbar">
    <div class="between"><a class="brand" href="#/">دستیار خرید حضوری</a><a class="planlink" id="planLink" href="#/plan">🗺 برنامه‌ی بازدید</a></div>
    <div id="homeAbove" class="home-above" hidden></div>
    <form class="searchbox" id="searchForm" role="search">
      <input id="q" name="q" type="search" placeholder="چه می‌خواهید بخرید؟" autocomplete="off" enterkeyhint="search">
      <button type="submit" aria-label="جست‌وجو">جست‌وجو</button>
    </form>
    <div id="locbar" class="locbar" hidden aria-label="محل خرید"></div>
    <div id="homeBelow" class="home-below" hidden></div>
    <nav class="ctxbar" id="ctxbar" aria-label="شرایط خرید"></nav>
  </header>
  <dialog id="sheet" class="sheet" aria-label="تنظیم شرایط"></dialog>
  <main id="view" class="page" aria-live="polite"></main>
  <footer class="foot" id="foot"></footer>
  <script src="/static/ai.js?v={{asset_version}}"></script>
  <script src="/static/app.js?v={{asset_version}}"></script>
</body>
</html>
